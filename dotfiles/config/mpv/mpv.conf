# Video output - use GPU-accelerated rendering on Wayland
gpu-context=wayland

vo=gpu
gpu-api=opengl

# Hardware decoding - use Intel VA-API
hwdec=vaapi
hwdec-codecs=h264,hevc,av1,vp8,vp9

# VA-API device (Intel GPU)
vaapi-device=/dev/dri/renderD128

# Language preferences
alang=en,eng,english

# IPC
input-ipc-server=/tmp/mpvsock
